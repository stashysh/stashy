syntax = "proto3";

package stashy.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/stashysh/stashy/gen/stashy/v1;stashyv1";

message File {
  // Unique file ID.
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
  // Human-readable name at the end of the URL. Empty when not set.
  string slug = 2 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9._~-]*$"
    max_len: 128
  }];
  // Canonical URL of the file, including the slug when set.
  string url = 3 [(buf.validate.field) = {
    required: true
    string: {uri: true}
  }];
  // Original filename, e.g. "Quarterly report.pdf". Empty when not set.
  string name = 4 [(buf.validate.field).string = {
    max_len: 255
    pattern: "^[^/\\x00-\\x1F\\x7F]*$"
  }];
  // Media type of the content, from the Content-Type of the upload.
  string content_type = 5 [(buf.validate.field).required = true];
  // Size of the content in bytes.
  int64 size = 6 [(buf.validate.field).int64.gte = 0];
  // CRC32C checksum of the content.
  string checksum = 7 [(buf.validate.field).string.pattern = "^([A-Za-z0-9+/]{6}==)?$"];
  // Who can open the file by its URL: "private" (only the owner), "internal"
  // (any signed-in user), or "public" (anyone).
  string visibility = 8 [(buf.validate.field) = {
    required: true
    string: {
      in: [
        "private",
        "internal",
        "public"
      ]
    }
  }];
  google.protobuf.Timestamp created_at = 9 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 10 [(buf.validate.field).required = true];
}

service FileService {
  // Upload a new file. The request body is the file's content, and its
  // Content-Type is stored with it.
  rpc CreateFile(stream CreateFileRequest) returns (CreateFileResponse) {
    option (google.api.http) = {
      post: "/v1/files"
      body: "content"
      response_body: "file"
    };
    option (gnostic.openapi.v3.operation) = {
      parameters: {
        parameter: {
          name: "slug"
          in: "query"
          description: "Human-readable end of the file's URL (/{id}/{slug})."
          schema: {
            schema: {
              type: "string"
              max_length: 128
              pattern: "^[A-Za-z0-9._~-]*$"
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "name"
          in: "query"
          description: "Original filename, e.g. \"Quarterly report.pdf\"."
          schema: {
            schema: {
              type: "string"
              max_length: 255
            }
          }
        }
      }
      parameters: {
        parameter: {
          name: "visibility"
          in: "query"
          description: "Who can open the file by its URL. Defaults to internal."
          schema: {
            schema: {
              type: "string"
              enum: {yaml: "private"}
              enum: {yaml: "internal"}
              enum: {yaml: "public"}
            }
          }
        }
      }
      request_body: {
        request_body: {
          content: {
            additional_properties: {
              name: "*/*"
              value: {
                schema: {
                  schema: {
                    type: "string"
                    format: "binary"
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // List your files, newest first. To get the next page, pass the last
  // file's ID as after. A page shorter than limit is the last one.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/files"
      response_body: "files"
    };
  }

  // Get a file's metadata.
  rpc GetFile(GetFileRequest) returns (GetFileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/files/{id}"
      response_body: "file"
    };
  }

  // Get a file's content. Supports Range requests.
  rpc GetFileContent(GetFileContentRequest) returns (stream GetFileContentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/files/{id}/content"
      response_body: "content"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              content: {
                additional_properties: {
                  name: "*/*"
                  value: {
                    schema: {
                      schema: {
                        type: "string"
                        format: "binary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Update a file. Fields are optional: an absent field is left unchanged,
  // an empty value clears it.
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      patch: "/v1/files/{id}"
      body: "*"
      response_body: "file"
    };
  }

  // Update a file's content, replacing it entirely. Its ID and URL stay the
  // same.
  rpc UpdateFileContent(stream UpdateFileContentRequest) returns (UpdateFileContentResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {
      put: "/v1/files/{id}/content"
      body: "content"
      response_body: "file"
    };
    option (gnostic.openapi.v3.operation) = {
      request_body: {
        request_body: {
          content: {
            additional_properties: {
              name: "*/*"
              value: {
                schema: {
                  schema: {
                    type: "string"
                    format: "binary"
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Permanently delete a file and its content. Its URL stops working.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {delete: "/v1/files/{id}"};
  }
}

message CreateFileRequest {
  google.api.HttpBody content = 1 [(buf.validate.field).required = true];
  // Human-readable end of the file's URL (/{id}/{slug}). Over REST, pass it as
  // the slug query parameter.
  optional string slug = 2 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9._~-]*$"
    max_len: 128
  }];
  // Original filename, e.g. "Quarterly report.pdf". Over REST, pass it as the
  // name query parameter.
  optional string name = 3 [(buf.validate.field).string = {
    max_len: 255
    pattern: "^[^/\\x00-\\x1F\\x7F]*$"
  }];
  // Who can open the file by its URL; defaults to "internal". Over REST, pass
  // it as the visibility query parameter.
  optional string visibility = 4 [(buf.validate.field).string = {
    in: [
      "private",
      "internal",
      "public"
    ]
  }];
}

message CreateFileResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message ListFilesRequest {
  // Maximum number of files to return. Absent means 50.
  optional int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // ID of the last file from the previous page. Absent means the first page.
  optional string after = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9_-]{21}$"}];
}

message ListFilesResponse {
  // Newest first.
  repeated File files = 1;
}

message GetFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message GetFileResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message GetFileContentRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message GetFileContentResponse {
  google.api.HttpBody content = 1 [(buf.validate.field).required = true];
}

message UpdateFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
  // Human-readable slug used in the file's canonical URL (/{id}/{slug}).
  // An empty string clears it.
  optional string slug = 2 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9._~-]*$"
    max_len: 128
  }];
  // Original filename. An empty string clears it.
  optional string name = 3 [(buf.validate.field).string = {
    max_len: 255
    pattern: "^[^/\\x00-\\x1F\\x7F]*$"
  }];
  // Who can open the file by its URL.
  optional string visibility = 4 [(buf.validate.field).string = {
    in: [
      "private",
      "internal",
      "public"
    ]
  }];
}

message UpdateFileResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message UpdateFileContentRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
  google.api.HttpBody content = 2 [(buf.validate.field).required = true];
}

message UpdateFileContentResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message DeleteFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message DeleteFileResponse {}

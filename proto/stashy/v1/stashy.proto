syntax = "proto3";

package stashy.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/stashysh/stashy/gen/stashy/v1;stashyv1";

message File {
  // Unique file ID.
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
  // Canonical URL of the file, including the slug when set.
  string url = 2 [(buf.validate.field) = {
    required: true
    string: {uri: true}
  }];
  // Media type of the content, from the Content-Type of the upload.
  string content_type = 3 [(buf.validate.field).required = true];
  // Size of the content in bytes.
  int64 size = 4 [(buf.validate.field).int64.gte = 0];
  // Whether anyone can open the URL without signing in.
  bool public = 5;
  // Human-readable name at the end of the URL. Empty when not set.
  string slug = 6 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9._~-]*$"
    max_len: 128
  }];
  google.protobuf.Timestamp created_at = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 8 [(buf.validate.field).required = true];
}

service FileService {
  // Upload a new file. The request body is the file's content, and its
  // Content-Type is stored with it.
  rpc CreateFile(stream CreateFileRequest) returns (CreateFileResponse) {
    option (google.api.http) = {
      post: "/v1/files"
      body: "content"
      response_body: "file"
    };
    option (gnostic.openapi.v3.operation) = {
      request_body: {
        request_body: {
          content: {
            additional_properties: {
              name: "*/*"
              value: {
                schema: {
                  schema: {
                    type: "string"
                    format: "binary"
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Get a file's metadata.
  rpc GetFile(GetFileRequest) returns (GetFileResponse) {
    option (google.api.http) = {
      get: "/v1/files/{id}"
      response_body: "file"
    };
  }

  // Get a file's content. Supports Range requests.
  rpc GetFileContent(GetFileContentRequest) returns (stream GetFileContentResponse) {
    option (google.api.http) = {
      get: "/v1/files/{id}/content"
      response_body: "content"
    };
    option (gnostic.openapi.v3.operation) = {
      responses: {
        response_or_reference: {
          name: "200"
          value: {
            response: {
              content: {
                additional_properties: {
                  name: "*/*"
                  value: {
                    schema: {
                      schema: {
                        type: "string"
                        format: "binary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // List your files, newest first. To get the next page, pass the last
  // file's ID as after. A page shorter than limit is the last one.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option (google.api.http) = {
      get: "/v1/files"
      response_body: "files"
    };
  }

  // Replace a file's content. Its ID and URL stay the same.
  rpc ReplaceFile(stream ReplaceFileRequest) returns (ReplaceFileResponse) {
    option (google.api.http) = {
      put: "/v1/files/{id}"
      body: "content"
      response_body: "file"
    };
    option (gnostic.openapi.v3.operation) = {
      request_body: {
        request_body: {
          content: {
            additional_properties: {
              name: "*/*"
              value: {
                schema: {
                  schema: {
                    type: "string"
                    format: "binary"
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Update a file. Fields are optional: an absent field is left unchanged,
  // an empty value clears it.
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse) {
    option (google.api.http) = {
      patch: "/v1/files/{id}"
      body: "*"
      response_body: "file"
    };
  }

  // Make a file publicly accessible.
  rpc PublishFile(PublishFileRequest) returns (PublishFileResponse) {
    option (google.api.http) = {
      post: "/v1/files/{id}/publish"
      body: "*"
    };
  }

  // Remove public access from a file.
  rpc UnpublishFile(UnpublishFileRequest) returns (UnpublishFileResponse) {
    option (google.api.http) = {
      post: "/v1/files/{id}/unpublish"
      body: "*"
    };
  }

  // Permanently delete a file and its content. Its URL stops working.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option (google.api.http) = {delete: "/v1/files/{id}"};
  }
}

message CreateFileRequest {
  google.api.HttpBody content = 1 [(buf.validate.field).required = true];
}

message CreateFileResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message GetFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message GetFileResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message GetFileContentRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message GetFileContentResponse {
  google.api.HttpBody content = 1 [(buf.validate.field).required = true];
}

message ListFilesRequest {
  // Maximum number of files to return. Absent means 50.
  optional int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  // ID of the last file from the previous page. Absent means the first page.
  optional string after = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9_-]{21}$"}];
}

message ListFilesResponse {
  // Newest first.
  repeated File files = 1;
}

message ReplaceFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
  google.api.HttpBody content = 2 [(buf.validate.field).required = true];
}

message ReplaceFileResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message UpdateFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
  // Human-readable slug used in the file's canonical URL (/{id}/{slug}).
  // An empty string clears it.
  optional string slug = 2 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9._~-]*$"
    max_len: 128
  }];
}

message UpdateFileResponse {
  File file = 1 [(buf.validate.field).required = true];
}

message DeleteFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message DeleteFileResponse {}

message PublishFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message PublishFileResponse {}

message UnpublishFileRequest {
  string id = 1 [(buf.validate.field) = {
    required: true
    string: {pattern: "^[A-Za-z0-9_-]{21}$"}
  }];
}

message UnpublishFileResponse {}

version: v2
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.2
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/openapi:v0.30.0
    out: public
    opt:
      - features=google.api.http
      - short-operation-ids
      - trim-unused-types
      - with-proto-names
      - without-default-tags
      - path=openapi.yaml
